<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>SAML ZIP → KV-import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;}
    .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 500px; width: 100%; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem 0; }
    p.description { margin: 0 0 1.25rem 0; color: #4b5563; font-size: 0.9rem; line-height: 1.4;}
    .field { margin-bottom: 1.2rem; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb;}
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #374151;}
    input[type="file"] { width: 100%; font-size: 0.85rem;}
    .hint { font-size: 0.75rem; color: #6b7280; margin-top: 0.4rem; }
    .actions { display: flex; gap: 10px; margin-top: 1.5rem; }
    button { flex: 1; padding: 0.6rem 1rem; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #uploadBtn { background: #2563eb; color: #fff; }
    #clearBtn { background: #ef4444; color: #fff; }
    .status-box { margin-top: 1.5rem; padding: 15px; border-radius: 8px; display: none; font-size: 0.9rem;}
    .status-box.processing { display: block; background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; }
    .status-box.ready { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status-box.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .status-title { font-weight: 600; margin-bottom: 0.2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Läs in Metadata (SAML)</h1>
    <p class="description">Ladda upp ZIP-filen med SAML-entiteter. Om vissa entiteter använder UID/UUID istället för orgnr, bifoga mappningsfilen.</p>

    <div class="field">
      <label for="zipFile">1. SAML Metadata (ZIP)</label>
      <input type="file" id="zipFile" accept=".zip" />
    </div>

    <div class="field">
      <label for="csvFile">2. Mappningsfil (CSV) - Valfritt</label>
      <input type="file" id="csvFile" accept=".csv" />
      <div class="hint">Format: <code>organization_number,uid</code></div>
    </div>

    <div class="actions">
      <button id="uploadBtn">Läs in filer till KV</button>
      <button id="clearBtn">Rensa databasen</button>
    </div>

    <div id="statusBox" class="status-box">
      <div id="statusTitle" class="status-title"></div>
      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    const zipFileInput = document.getElementById("zipFile");
    const csvFileInput = document.getElementById("csvFile");
    const uploadBtn = document.getElementById("uploadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusBox = document.getElementById("statusBox");
    const statusTitle = document.getElementById("statusTitle");
    const statusMsg = document.getElementById("statusMsg");

    function setStatus(type, title, msg) {
      statusBox.className = "status-box " + type;
      statusTitle.textContent = title;
      statusMsg.textContent = msg;
    }

    // --- CSV PARSER ---
    async function parseMappingCsv(file) {
      if (!file) return {};
      const text = await file.text();
      const lines = text.split(/\r?\n/);
      const map = {};
      
      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(',');
        if (parts.length >= 2) {
          const orgnr = parts[0].trim();
          const uid = parts[1].trim();
          
          if (orgnr.toLowerCase() === 'organization_number') continue; // Skippa header
          
          // Spara UID exakt som den är
          map[uid] = orgnr;
          
          // Spara även varianter med/utan "en-" i minnet för att vara helt bombsäkra
          if (uid.startsWith("en-")) {
            map[uid.substring(3)] = orgnr;
          } else {
            map["en-" + uid] = orgnr;
          }
        }
      }
      return map;
    }

    // --- XML HJÄLPARE ---
    function getTagText(doc, tagName) {
      const els = doc.getElementsByTagNameNS('*', tagName);
      if (!els.length) return "";
      // Leta i första hand efter svenska (xml:lang="sv")
      for (let i = 0; i < els.length; i++) {
        if (els[i].getAttribute('xml:lang') === 'sv') return els[i].textContent.trim();
      }
      return els[0].textContent.trim();
    }

    // --- UPLOAD LOGIK ---
    uploadBtn.addEventListener("click", async () => {
      if (!zipFileInput.files.length) {
        return setStatus("error", "Fel", "Du måste välja en ZIP-fil först.");
      }

      uploadBtn.disabled = true;
      clearBtn.disabled = true;
      setStatus("processing", "Bearbetar...", "Läser in filer lokalt...");

      try {
        // 1. Läs in CSV (om vald)
        const idMap = await parseMappingCsv(csvFileInput.files[0]);
        const mappedCount = Object.keys(idMap).length;
        console.log(`Laddade in ${mappedCount} mappnings-regler.`);

        // 2. Läs in ZIP
        const zipFile = zipFileInput.files[0];
        const zipData = await zipFile.arrayBuffer();
        const zip = await JSZip.loadAsync(zipData);
        
        const globalMap = {};
        const parser = new DOMParser();

        // 3. Loopa igenom XML
        for (const [relativePath, fileObj] of Object.entries(zip.files)) {
          if (fileObj.dir || !relativePath.endsWith(".xml")) continue;

          const xmlString = await fileObj.async("string");
          const doc = parser.parseFromString(xmlString, "application/xml");

          // Extrahera rå-ID (Kollar först Scope, sen entityID)
          let rawId = null;
          const scopes = Array.from(doc.getElementsByTagNameNS('*', 'Scope'));
          for (const scope of scopes) {
            const text = scope.textContent.trim();
            if (text.endsWith('.fedscope.se')) {
              rawId = text.replace('.fedscope.se', '');
              break;
            }
          }

          if (!rawId) {
            const entityID = doc.documentElement.getAttribute('entityID');
            if (entityID) {
              const parts = entityID.split('/');
              rawId = parts[parts.length - 1];
            }
          }

          if (rawId) {
            // -- DET MAGISKA STEGET: Mappning och Tvätt --
            let finalOrgnr = idMap[rawId] || rawId;

            // NYTT: Tvätta bort suffix (t.ex. .IIS111301) om det som står före punkten är ett orgnr
            if (finalOrgnr && finalOrgnr.includes('.')) {
              const parts = finalOrgnr.split('.');
              // Kollar om första delen består av exakt 10 till 12 siffror
              if (/^\d{10,12}$/.test(parts[0])) {
                finalOrgnr = parts[0];
              }
            }

            const orgName = getTagText(doc, "OrganizationName");
            const orgDispName = getTagText(doc, "OrganizationDisplayName");
            const entityID = doc.documentElement.getAttribute('entityID') || "";

            // Deduplicering/Uppdatering i globalMap
            if (!globalMap[finalOrgnr]) {
              globalMap[finalOrgnr] = {
                orgnr: finalOrgnr,
                organizationName: orgName,
                organizationDisplayName: orgDispName,
                entityID: entityID
              };
            } else {
              const existing = globalMap[finalOrgnr];
              if (!existing.organizationName && orgName) existing.organizationName = orgName;
              if (!existing.organizationDisplayName && orgDispName) existing.organizationDisplayName = orgDispName;
              if (!existing.entityID && entityID) existing.entityID = entityID;
            }
          }
        }

        const items = Object.values(globalMap);
        if (!items.length) throw new Error("Kunde inte hitta några giltiga entiteter i ZIP-filen.");

        setStatus("processing", "Sparar...", `Skickar ${items.length} organisationer till servern...`);

        // 4. Skicka till Workern
        const res = await fetch("/api/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });

        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        
        setStatus("ready", "Klart!", `Importerade ${data.imported} organisationer (uppdelade i ${data.batches} batchar).`);
      } catch (e) {
        setStatus("error", "Fel", e.message);
      } finally {
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
      }
    });

    // --- CLEAR LOGIK ---
    clearBtn.addEventListener("click", async () => {
      if (!confirm("Är du helt säker på att du vill rensa hela databasen? Allt osparat arbete försvinner.")) return;
      
      uploadBtn.disabled = true;
      clearBtn.disabled = true;
      setStatus("processing", "Rensar...", "Tar bort all data från Cloudflare KV...");

      try {
        const res = await fetch("/api/clear", { method: "POST" });
        if (!res.ok) throw new Error("Kunde inte rensa databasen");
        const data = await res.json();
        setStatus("ready", "Rensad", `Databasen är tömd (tog bort ${data.deleted} poster).`);
      } catch (e) {
        setStatus("error", "Fel vid rensning", e.message);
      } finally {
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
