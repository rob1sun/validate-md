<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>SAML ZIP → KV-import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Samma styling som tidigare */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 480px; width: 100%; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem 0; }
    p.description { margin: 0 0 1.25rem 0; color: #4b5563; font-size: 0.95rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.9rem; }
    input[type="file"] { width: 100%; }
    button { display: inline-flex; align-items: center; justify-content: center; padding: 0.5rem 0.9rem; border-radius: 999px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; background: #111827; color: #ffffff; transition: all 0.1s ease; }
    button:hover { background: #1f2937; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }
    .buttons { display: flex; gap: 0.75rem; margin-top: 0.25rem; flex-wrap: wrap; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .status-box { margin-top: 1rem; padding: 0.75rem 0.9rem; border-radius: 10px; background: #f3f4f6; font-size: 0.85rem; line-height: 1.5; color: #374151; word-break: break-word; white-space: pre-line; }
    .status-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 0.35rem; }
    .dot-idle { background: #9ca3af; }
    .dot-processing { background: #f59e0b; }
    .dot-ready { background: #10b981; }
    .dot-error { background: #ef4444; }
    .status-line { display: flex; align-items: center; margin-bottom: 0.25rem; }
    .small { font-size: 0.8rem; color: #6b7280; }
    .hint { margin-top: 0.25rem; font-size: 0.8rem; color: #6b7280; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>SAML ZIP → KV-import</h1>
    <p class="description">
      Extraherar data från <code>shibmd:Scope</code> och sparar i KV.
    </p>

    <form id="uploadForm">
      <div class="field">
        <label for="zipFile">ZIP-fil med SAML-XML</label>
        <input type="file" id="zipFile" name="zipFile" accept=".zip" required />
        <div class="hint">Varje entitet ska ligga i en egen XML-fil.</div>
      </div>

      <div class="buttons">
        <button type="submit" id="uploadBtn">Ladda upp &amp; importera</button>
        <button type="button" id="clearBtn" class="btn-secondary">Rensa all data</button>
      </div>
    </form>

    <div class="status-box" id="statusBox">
      <div class="status-line">
        <span class="status-dot dot-idle" id="statusDot"></span>
        <span class="status-label"><strong>Status:</strong></span>
        <span id="statusText">Idle</span>
      </div>
      <div id="statusDetails" class="small">Ingen import har körts ännu.</div>
    </div>
  </div>

  <script>
    (function () {
      const uploadForm = document.getElementById("uploadForm");
      const zipInput = document.getElementById("zipFile");
      const uploadBtn = document.getElementById("uploadBtn");
      const clearBtn = document.getElementById("clearBtn");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const statusDetails = document.getElementById("statusDetails");

      function setStatus(mode, text, details) {
        statusDot.className = "status-dot dot-" + mode;
        statusText.textContent = text || "";
        if (details) statusDetails.textContent = details;
      }

      async function fetchStatusFromWorker() {
        try {
          const res = await fetch("/api/status");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data.status === "ready") {
            const msg = `Senaste import: ${data.meta?.lastImportAt || "okänt"} · ${data.meta?.count || 0} orgnr.`;
            setStatus("ready", "Klar", msg);
          }
        } catch (e) { setStatus("error", "Fel", e.message); }
      }

      fetchStatusFromWorker();

      uploadForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!zipInput.files?.[0]) return;
        
        uploadBtn.disabled = true;
        clearBtn.disabled = true;
        setStatus("processing", "Läser ZIP...", "Analyserar filer...");

        const reader = new FileReader();
        reader.onload = e => handleZipBuffer(e.target.result);
        reader.readAsArrayBuffer(zipInput.files[0]);
      });

      function parseEntityXml(xmlString) {
        const results = [];
        try {
          const doc = new DOMParser().parseFromString(xmlString, "application/xml");
          let orgName = "", orgDisplay = "", entityID = "";
          const allNodes = doc.getElementsByTagName("*");

          for (let el of allNodes) {
            const local = el.localName || el.nodeName;
            if (local === "OrganizationName" && !orgName) orgName = el.textContent.trim();
            if (local === "OrganizationDisplayName" && !orgDisplay) orgDisplay = el.textContent.trim();
            if (local === "EntityDescriptor" && !entityID) entityID = el.getAttribute("entityID")?.trim();
          }

          const scopeOrgs = {};
          for (let el of allNodes) {
            if ((el.localName || el.nodeName) === "Scope") {
              const text = el.textContent.trim();
              // UPPDATERAD REGEX: 
              // 1. 10 siffror (\d{10})
              // 2. Valfri mellanliggande del som slutar på punkt (?:.+\.)?
              // 3. Avslutas med fedscope.se
              const match = text.match(/^(\d{10})\.(?:.+\.)?fedscope\.se$/);
              if (match && match[1]) scopeOrgs[match[1]] = true;
            }
          }

          for (let orgnr in scopeOrgs) {
            results.push({ orgnr, organizationName: orgName || null, organizationDisplayName: orgDisplay || null, entityID: entityID || null });
          }
        } catch (e) {}
        return results;
      }

      async function handleZipBuffer(arrayBuffer) {
        try {
          const zip = await JSZip.loadAsync(arrayBuffer);
          const globalMap = {};
          const files = Object.values(zip.files).filter(f => !f.dir);

          for (let f of files) {
            const text = await f.async("string");
            const entities = parseEntityXml(text);
            entities.forEach(item => {
              if (!globalMap[item.orgnr]) {
                globalMap[item.orgnr] = item;
              } else {
                if (!globalMap[item.orgnr].organizationName) globalMap[item.orgnr].organizationName = item.organizationName;
                if (!globalMap[item.orgnr].entityID) globalMap[item.orgnr].entityID = item.entityID;
              }
            });
          }

          const items = Object.values(globalMap);
          if (!items.length) throw new Error("Inga giltiga orgnr hittades (.fedscope.se)");

          setStatus("processing", "Sparar...", `Skickar ${items.length} orgnr till KV.`);

          const res = await fetch("/api/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items })
          });

          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          setStatus("ready", "Klar", `Importerade ${data.imported} orgnr.`);
        } catch (e) {
          setStatus("error", "Fel", e.message);
        } finally {
          uploadBtn.disabled = false;
          clearBtn.disabled = false;
        }
      }

      clearBtn.addEventListener("click", async () => {
        if (!confirm("Rensa allt?")) return;
        uploadBtn.disabled = true;
        clearBtn.disabled = true;
        setStatus("processing", "Rensar...", "Tar bort data...");
        try {
          const res = await fetch("/api/clear", { method: "POST" });
          const data = await res.json();
          setStatus("idle", "Idle", `Rensat ${data.deleted} nycklar.`);
        } catch (e) { setStatus("error", "Fel", e.message); }
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
      });
    })();
  </script>
</body>
</html>
